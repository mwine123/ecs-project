AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for ECS project

Parameters:
  VPCCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the Computer Store VPC.
  PublicSubnetACidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet A.
  PublicSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the public subnet B.
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.11.0/24
    Description: CIDR block for the private subnet A.
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.12.0/24
    Description: CIDR block for the private subnet B.
  DBPassword:
    Type: String
    NoEcho: true
    Description: Password for the RDS database.

Resources: 
  ComputerStoreVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ComputerStoreVPC
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ComputerStoreVPC
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ComputerStoreVPC
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ComputerStoreVPC
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ComputerStoreVPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ComputerStoreVPC

  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: 
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ComputerStoreVPC

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS EC2 instances.
      VpcId: !Ref ComputerStoreVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS database.
      VpcId: !Ref ComputerStoreVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EFS.
      VpcId: !Ref ComputerStoreVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  ComputerStoreEFS:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      FileSystemTags:
        - Key: Name
          Value: ComputerStoreEFS

  ComputerStoreEFSMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ComputerStoreEFS
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups:
        - !Ref EFSSecurityGroup

  ComputerStoreEFSMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ComputerStoreEFS
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups:
        - !Ref EFSSecurityGroup

  ComputerStoreECSCluster:
    Type: AWS::ECS::Cluster
  
  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: 
        - !Ref ECSInstanceRole

  ECSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: ComputerStoreECSLaunchTemplate
      LaunchTemplateData:
        InstanceType: t3.small
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !Ref ECSSecurityGroup
        IamInstanceProfile: 
          Name: !Ref ECSInstanceProfile
        ImageId: ami-07d4544a1fdee86a1
        UserData: 
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${ComputerStoreECSCluster} >> /etc/ecs/ecs.config

  ComputerStoreASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref ECSLaunchTemplate
        Version: !GetAtt ECSLaunchTemplate.LatestVersionNumber
      MinSize: 1
      DesiredCapacity: 1
      MaxSize: 2

  ComputerStoreRDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS database.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  ComputerStoreRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: computer-store-db
      AllocatedStorage: 20
      DBInstanceClass: db.t4g.micro
      Engine: mysql
      EngineVersion: 8.4.11
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref ComputerStoreRDSSubnetGroup
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp3
    DeletionPolicy: Snapshot

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/computer-store-logs
      RetentionInDays: 7

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  PhpMyAdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: phpmyadmin-task
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      Cpu: 224
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: phpmyadmin
          Essential: true
          Memory: 195
          Image: phpmyadmin/phpmyadmin:latest
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
          Environment:
            - Name: PMA_HOST
              Value: !GetAtt ComputerStoreRDSInstance.Endpoint.Address
            - Name: PMA_PORT
              Value: "3306"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phpmyadmin

  PhpMyAdminService:
    Type: AWS::ECS::Service
    Properties:
      AvailabilityZoneRebalancing: DISABLED
      Cluster: !Ref ComputerStoreECSCluster
      DesiredCount: 1
      TaskDefinition: !Ref PhpMyAdminTaskDefinition
      LaunchType: EC2
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0

  MetabaseTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: 
      - ComputerStoreEFS
      - ComputerStoreEFSMountTargetA
      - ComputerStoreEFSMountTargetB
    Properties:
      Family: metabase-task
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      Cpu: 799
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: metabase
          Essential: true
          Memory: 1331
          Image: metabase/metabase:latest
          PortMappings:
            - ContainerPort: 3000
              HostPort: 3000
          Environment:
            - Name: MB_DB_FILE
              Value: /metabase-data/metabase.db
            - Name: JAVA_TOOL_OPTIONS
              Value: "-XX:MaxRAMPercentage=75.0"
          MountPoints:
            - ContainerPath: /metabase-data
              SourceVolume: metabase-data
              ReadOnly: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: metabase
      Volumes: 
        - Name: metabase-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref ComputerStoreEFS
            TransitEncryption: ENABLED
            RootDirectory: "/"

  MetabaseService:
    Type: AWS::ECS::Service
    Properties:
      AvailabilityZoneRebalancing: DISABLED
      Cluster: !Ref ComputerStoreECSCluster
      DesiredCount: 1
      TaskDefinition: !Ref MetabaseTaskDefinition
      LaunchType: EC2
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0

Outputs:
  VPCId:
    Description: The ID of the VPC
    Value: !Ref ComputerStoreVPC
  PublicSubnetAId:
    Description: The ID of the public subnet A
    Value: !Ref PublicSubnetA
  PublicSubnetBId:
    Description: The ID of the public subnet B
    Value: !Ref PublicSubnetB
  PrivateSubnetAId:
    Description: The ID of the private subnet A
    Value: !Ref PrivateSubnetA
  PrivateSubnetBId:
    Description: The ID of the private subnet B
    Value: !Ref PrivateSubnetB
